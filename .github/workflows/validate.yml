name: 验证交互课程与技能包

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/build_demo.py
      - run: npm test
      - run: python3 scripts/package_skill.py
      - name: 生成结果与已提交文件一致
        run: git diff --exit-code -- docs/index.html docs/interactive-first.html dist/dialogue-tutor-2.0.0.zip
